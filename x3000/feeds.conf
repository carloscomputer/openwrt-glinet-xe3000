# so a rebuild gets exactly the package set of that release.
# Feeds configuration for the GL.iNet GL-X3000 build. Copied verbatim to
# /feeds.conf by x3000/prepare.sh. The first five lines are the standard
# OpenWrt 25.12 feeds; the last is the local symlink dir populated from
# x3000/custom-feeds.txt.
